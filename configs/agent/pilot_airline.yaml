# Pilot: 10 sampled airline tasks, 1 trial, Gemini free tier. Measures tokens and cost per trace.
# Offline check first:  atl-agent run --config configs/agent/pilot_airline.yaml --smoke
run_name: pilot_airline_gemini38flash
domain: airline
num_tasks: 10
task_sample_seed: 0
num_trials: 1
seed: 300
agent_model: gemini/gemini-3.8-flash
agent_llm_args: {}  # provider defaults; Google recommends default temperature for Gemini 3
user_model: gemini/gemini-3.5-flash-lite  # fixed user simulator for every run
user_llm_args: {}
prompt_variant: tau2_default
user_variant: tau2_default
max_steps: 100
# Cap on *nominal* spend (paid-tier list prices below). On the free tier the real cost is $0,
# but the cap still bounds usage, and the log gives the paid-tier projection.
budget_usd: 5.0
requests_per_minute: 8  # free-tier Flash allows ~10
prices:  # USD per 1M tokens, ai.google.dev/gemini-api/docs/pricing, checked 2026-10-03
  gemini/gemini-3.8-flash: {input: 0.75, output: 3.75}
  gemini/gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
output_dir: data/traces
cache_dir: data/llm_cache
cost_log: data/costs.jsonl
